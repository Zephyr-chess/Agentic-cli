<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic CLI - Auto Pilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .chat-container { height: calc(100vh - 140px); }
        .thought-bubble { position: relative; }
        .thought-bubble::before { content: ''; position: absolute; left: -10px; top: 10px; border-width: 10px 10px 10px 0; border-color: transparent #1e293b transparent transparent; }
    </style>
</head>
<body class="bg-dark-950 text-dark-200 overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-72 bg-dark-900 border-r border-dark-800 flex flex-col hidden lg:flex">
            <div class="p-6 border-b border-dark-800">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <span class="font-bold text-lg tracking-tight">Agentic CLI</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <div>
                    <h3 class="text-xs font-semibold text-dark-500 uppercase tracking-wider mb-3">Project Files</h3>
                    <div id="file-list" class="space-y-1 text-sm text-dark-400">
                        <div class="flex items-center p-2 hover:bg-dark-800 rounded cursor-pointer transition">
                            <i class="far fa-folder mr-2 text-blue-400"></i> agentic_cli/
                        </div>
                        <div class="flex items-center p-2 hover:bg-dark-800 rounded cursor-pointer transition pl-6">
                            <i class="fab fa-python mr-2 text-yellow-500"></i> main.py
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-semibold text-dark-500 uppercase tracking-wider mb-3">Task Timeline</h3>
                    <div id="timeline" class="space-y-4">
                        <!-- Timeline entries -->
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-dark-800">
                <div class="flex items-center justify-between text-xs text-dark-500">
                    <span>v3.0.0 Alpha</span>
                    <span class="flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col bg-dark-950 relative">
            <!-- Top Navbar -->
            <header class="h-16 border-b border-dark-800 flex items-center justify-between px-8 bg-dark-950/80 backdrop-blur-md z-10">
                <div class="flex items-center space-x-6">
                    <div class="flex items-center space-x-2 bg-dark-900 rounded-full px-4 py-1.5 border border-dark-800">
                        <i class="fas fa-microchip text-blue-500 text-xs"></i>
                        <span class="text-xs font-medium text-dark-300" id="model-name">qwen/qwen3-coder:free</span>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-pilot-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-dark-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ml-3 text-xs font-semibold text-dark-400 uppercase tracking-tighter">Auto-Pilot</span>
                    </label>
                    <button class="w-9 h-9 flex items-center justify-center hover:bg-dark-800 rounded-full transition"><i class="fas fa-cog text-dark-400"></i></button>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-window" class="flex-1 overflow-y-auto p-8 space-y-8 chat-container scrollbar-hide pb-32">
                <div class="max-w-4xl mx-auto space-y-8">
                    <!-- Welcome -->
                    <div class="flex space-x-4 animate-in fade-in duration-500">
                        <div class="w-10 h-10 rounded-xl bg-blue-600/20 flex items-center justify-center border border-blue-600/30 flex-shrink-0">
                            <i class="fas fa-robot text-blue-400"></i>
                        </div>
                        <div class="bg-dark-900 border border-dark-800 p-5 rounded-2xl rounded-tl-none shadow-xl max-w-2xl">
                            <p class="text-sm leading-relaxed">
                                Welcome to **Agentic CLI v3**. I'm Jules, your autonomous coding partner.
                                Give me a task, and I'll handle the planning and execution.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="absolute bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-dark-950 via-dark-950 to-transparent">
                <div class="max-w-4xl mx-auto relative group">
                    <textarea id="user-input"
                        class="w-full bg-dark-900 border border-dark-800 group-hover:border-dark-700 focus:border-blue-500 rounded-2xl px-6 py-4 pr-16 text-sm focus:outline-none transition-all shadow-2xl resize-none placeholder-dark-600"
                        placeholder="What should we build today?" rows="1"></textarea>
                    <button id="send-btn" class="absolute right-4 bottom-3.5 w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition-all transform active:scale-95 shadow-lg shadow-blue-950">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Approval -->
    <div id="modal" class="fixed inset-0 bg-dark-950/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-dark-900 p-8 rounded-3xl border border-dark-800 max-w-lg w-full shadow-2xl transform scale-110">
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-12 h-12 bg-yellow-500/20 rounded-2xl flex items-center justify-center border border-yellow-500/30">
                    <i class="fas fa-shield-halved text-yellow-500 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-white">Action Required</h3>
                    <p class="text-xs text-dark-500 uppercase tracking-widest font-semibold">User Confirmation</p>
                </div>
            </div>

            <div class="bg-dark-950 rounded-2xl p-4 border border-dark-800 mb-8">
                <p id="modal-title" class="text-blue-400 font-bold text-sm mb-2 uppercase"></p>
                <pre id="modal-args" class="text-xs mono text-dark-300 overflow-x-auto whitespace-pre-wrap"></pre>
            </div>

            <div class="flex space-x-3">
                <button id="reject-btn" class="flex-1 px-6 py-3 text-sm font-semibold text-dark-400 hover:bg-dark-800 rounded-xl transition">Reject</button>
                <button id="approve-btn" class="flex-1 px-6 py-3 text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-900 transition">Execute</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window').firstElementChild;
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('modal');
        const autoPilot = document.getElementById('auto-pilot-toggle');
        const timeline = document.getElementById('timeline');

        let currentThoughtDiv = null;

        function updateTimeline(name, status) {
            const entry = document.createElement('div');
            entry.className = "flex items-start space-x-3";
            const icon = status === 'done' ? 'fa-check-circle text-green-500' : 'fa-spinner fa-spin text-blue-500';
            entry.innerHTML = `
                <div class="mt-0.5"><i class="fas ${icon} text-xs"></i></div>
                <div class="flex-1">
                    <div class="text-xs font-medium text-dark-200">${name}</div>
                    <div class="text-[10px] text-dark-500">${new Date().toLocaleTimeString()}</div>
                </div>
            `;
            timeline.prepend(entry);
        }

        function appendMessage(role, content, isTool = false) {
            const wrapper = document.createElement('div');
            wrapper.className = "flex space-x-4 animate-in slide-in-from-bottom-2 duration-300";

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="flex-1"></div>
                    <div class="bg-blue-600 text-white px-6 py-3 rounded-2xl rounded-tr-none shadow-xl max-w-xl">
                        <p class="text-sm leading-relaxed">${content}</p>
                    </div>
                `;
            } else {
                const iconClass = isTool ? 'fa-terminal text-yellow-500' : 'fa-robot text-blue-400';
                const bgClass = isTool ? 'bg-yellow-500/10 border-yellow-500/20' : 'bg-dark-900 border-dark-800';
                wrapper.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-dark-900 flex items-center justify-center border border-dark-800 flex-shrink-0">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <div class="${bgClass} border p-5 rounded-2xl rounded-tl-none shadow-xl flex-1 max-w-3xl overflow-hidden">
                        ${isTool ? `<pre class="text-xs mono text-dark-300 overflow-x-auto">${content}</pre>` : `<p class="text-sm leading-relaxed whitespace-pre-wrap">${content}</p>`}
                    </div>
                `;
            }
            chatWindow.appendChild(wrapper);
            wrapper.scrollIntoView({ behavior: 'smooth' });
            return wrapper.querySelector('p, pre');
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            appendMessage('user', text);

            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, auto_pilot: autoPilot.checked })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            currentThoughtDiv = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const lines = decoder.decode(value).split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = JSON.parse(line.substring(6));
                        handleEvent(data);
                    }
                }
            }
        }

        let lastToolRequest = null;

        function handleEvent(data) {
            if (data.type === 'thought') {
                if (!currentThoughtDiv) {
                    currentThoughtDiv = appendMessage('assistant', '');
                }
                currentThoughtDiv.innerText = data.content;
                currentThoughtDiv.scrollIntoView();
            } else if (data.type === 'tool_start') {
                updateTimeline(data.name, 'running');
            } else if (data.type === 'tool_end') {
                appendMessage('assistant', `Tool Result [${data.name}]:\n${data.result}`, true);
                currentThoughtDiv = null;
            } else if (data.type === 'approval_required') {
                lastToolRequest = data;
                document.getElementById('modal-title').innerText = data.name;
                document.getElementById('modal-args').innerText = JSON.stringify(data.args, null, 2);
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else if (data.type === 'done') {
                currentThoughtDiv = null;
            }
        }

        async function approve(action) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            const res = await fetch('/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...lastToolRequest })
            });
            const result = await res.json();
            if (action === 'approve') {
                appendMessage('assistant', `Tool Result [${lastToolRequest.name}]:\n${result.result}`, true);
                // After approval, continue session - we simply send a prompt back to agent
                // In a perfect system, the server would handle this loop.
            }
        }

        document.getElementById('approve-btn').onclick = () => approve('approve');
        document.getElementById('reject-btn').onclick = () => approve('reject');

        sendBtn.onclick = sendMessage;
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            // Auto resize
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });

        // Initialize config
        fetch('/config').then(r => r.json()).then(data => {
            document.getElementById('model-name').innerText = data.model;
        });
    </script>
</body>
</html>
