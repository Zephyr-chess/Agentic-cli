<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic CLI - Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f1117; color: #e2e8f0; }
        .chat-container { height: calc(100vh - 180px); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .message-assistant { background-color: #1e293b; border-radius: 12px; }
        .message-user { background-color: #334155; border-radius: 12px; }
        .tool-card { background-color: #1a1c23; border: 1px solid #3b82f6; }
    </style>
</head>
<body class="overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-[#161922] border-r border-gray-800 p-4 hidden md:block">
            <h1 class="text-xl font-bold mb-8 flex items-center">
                <i class="fas fa-robot mr-2 text-blue-500"></i> Agentic CLI
            </h1>
            <nav>
                <div class="text-xs uppercase text-gray-500 font-semibold mb-4">Files</div>
                <div id="file-list" class="space-y-2 text-sm text-gray-400">
                    <div class="flex items-center"><i class="far fa-folder mr-2"></i> src/</div>
                    <div class="flex items-center"><i class="far fa-file-code mr-2"></i> main.py</div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-[#0f1117]">
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-400" id="model-badge">
                        <i class="fas fa-microchip mr-1"></i> qwen/qwen3-coder:free
                    </span>
                </div>
                <div class="flex space-x-2">
                    <button class="p-2 hover:bg-gray-800 rounded-md"><i class="fas fa-cog"></i></button>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container scrollbar-hide">
                <!-- Welcome Message -->
                <div class="message-assistant p-4 max-w-3xl">
                    <p class="text-sm">Hello! I am Jules, your autonomous coding assistant. How can I help you today?</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6 bg-[#0f1117]">
                <div class="max-w-4xl mx-auto relative">
                    <textarea id="user-input"
                        class="w-full bg-[#1e293b] border border-gray-700 rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:border-blue-500 resize-none"
                        placeholder="Ask anything..." rows="2"></textarea>
                    <button id="send-btn" class="absolute right-3 bottom-3 text-blue-500 hover:text-blue-400">
                        <i class="fas fa-paper-plane text-xl"></i>
                    </button>
                </div>
                <div class="text-[10px] text-center mt-2 text-gray-500">
                    Press Shift + Enter for newline. Agentic CLI Web v1.0
                </div>
            </div>
        </div>
    </div>

    <!-- Approval Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-[#1e293b] p-6 rounded-xl border border-gray-700 max-w-md w-full">
            <h3 class="text-lg font-bold mb-2 flex items-center">
                <i class="fas fa-shield-alt mr-2 text-yellow-500"></i> Tool Approval
            </h3>
            <p id="modal-text" class="text-sm text-gray-300 mb-6"></p>
            <div class="flex justify-end space-x-3">
                <button id="reject-btn" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Reject</button>
                <button id="approve-btn" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold">Approve</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('modal');

        function addMessage(role, content, isTool = false) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

            let innerHTML = '';
            if (isTool) {
                innerHTML = `
                    <div class="tool-card p-4 rounded-lg w-full max-w-2xl">
                        <div class="flex items-center text-xs text-blue-400 mb-2 font-mono">
                            <i class="fas fa-terminal mr-2"></i> EXECUTING TOOL
                        </div>
                        <pre class="text-xs font-mono text-gray-300">${content}</pre>
                    </div>
                `;
            } else {
                innerHTML = `
                    <div class="p-4 ${role === 'user' ? 'message-user' : 'message-assistant'} max-w-2xl">
                        <p class="text-sm whitespace-pre-wrap">${content}</p>
                    </div>
                `;
            }

            div.innerHTML = innerHTML;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                processAgentResponse(data.response);
            } catch (err) {
                addMessage('assistant', 'Error: ' + err.message);
            }
        }

        function processAgentResponse(text) {
            // Simplified tool parsing for now
            if (text.includes('<tool>')) {
                const parts = text.split('<tool>');
                if (parts[0]) addMessage('assistant', parts[0]);

                const toolStr = parts[1].split('</tool>')[0];
                addMessage('assistant', toolStr, true);

                // Show approval for simplicity in this mockup
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.getElementById('modal-text').innerText = 'The agent wants to execute: ' + toolStr;
            } else {
                addMessage('assistant', text);
            }
        }

        sendBtn.onclick = sendMessage;
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('approve-btn').onclick = () => modal.classList.add('hidden');
        document.getElementById('reject-btn').onclick = () => modal.classList.add('hidden');
    </script>
</body>
</html>
